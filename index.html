<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesse Libras Rio Verde - Login</title>
    <link rel="stylesheet" href="style.css"> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

    <div id="login-page" class="auth-container">
        <div class="auth-box">
            <img src="logo.png" alt="Brasão Rio Verde" class="logo-auth">
            <h2>Login do Usuário</h2>
            <form id="login-form">
                <div class="input-group">
                <label for="login-email">Email</label>
                <div class="input-with-icon">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="login-email" required>
                </div>
            </div>
                <div class="input-group">
                    <label for="login-password">Senha</label>
                    <input type="password" id="login-password" required>
                </div>
                <button type="submit" class="btn btn-auth">Entrar</button>
            </form>
            <p class="auth-toggle">Não tem uma conta? <a href="#" id="show-register">Cadastre-se</a></p>
            <p class="auth-toggle-interpreter"><a href="#" id="show-interpreter-login">Acessar como Intérprete</a></p>
        </div>
    </div>

    <div id="register-page" class="auth-container hidden">
        <div class="auth-box">
            <img src="logo.png" alt="Brasão Rio Verde" class="logo-auth">
            <h2>Cadastro</h2>
            <p>Crie sua conta para acessar os serviços.</p>
            <form id="register-form">
                <div class="input-group">
                    <label for="register-name">Nome Completo</label>
                    <input type="text" id="register-name" required>
                </div>
                <div class="input-group">
                    <label for="register-email">Email</label>
                    <input type="email" id="register-email" required>
                </div>
                <div class="input-group">
                    <label for="register-password">Senha</label>
                    <input type="password" id="register-password" required>
                </div>
                <button type="submit" class="btn btn-auth">Cadastrar</button>
            </form>
            <p class="auth-toggle">Já tem uma conta? <a href="#" id="show-login">Faça Login</a></p>
        </div>
    </div>

    <div id="interpreter-login-page" class="auth-container hidden">
        <div class="auth-box">
            <img src="logo.png" alt="Brasão Rio Verde" class="logo-auth">
            <h2>Login do Intérprete</h2>
            <form id="interpreter-login-form">
                <div class="input-group">
                <label for="interpreter-login-email">Email (Intérprete)</label>
                <div class="input-with-icon">
                    <i class="fas fa-headset"></i>
                    <input type="email" id="interpreter-login-email" required>
                </div>
            </div>
                <div class="input-group">
                    <label for="interpreter-login-password">Senha</label>
                    <input type="password" id="interpreter-login-password" required>
                </div>
                <button type="submit" class="btn btn-auth">Entrar</button>
            </form>
            <p class="auth-toggle"><a href="#" id="show-user-login">Acessar como Usuário</a></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
